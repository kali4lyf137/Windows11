on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # MAX allowed by GitHub

    steps:
      - name: Update system
        run: |
          sudo apt update -y

      - name: Install GNOME + XRDP + required system users
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            ubuntu-desktop-minimal \
            gnome-session \
            gdm3 \
            xrdp \
            colord \
            gnome-remote-desktop \
            speech-dispatcher

          # Ensure system users exist (CI-safe)
          sudo systemd-sysusers || true
          sudo systemd-tmpfiles --create || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Configure XRDP for GNOME
        run: |
          echo "exec gnome-session" | sudo tee /etc/skel/.xsession

          sudo sed -i 's/^test -x/#test -x/' /etc/xrdp/startwm.sh
          sudo sed -i 's/^exec /#exec /' /etc/xrdp/startwm.sh
          echo "exec gnome-session" | sudo tee -a /etc/xrdp/startwm.sh

      - name: Create RDP User
        run: |
          PASSWORD=$(openssl rand -base64 16)
          sudo useradd -m -s /bin/bash rdp
          echo "rdp:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo,video,audio rdp

          echo "RDP_USER=rdp" >> $GITHUB_ENV
          echo "RDP_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-ubuntu-${{ github.run_id }}

          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Port
        run: |
          sudo ss -tlnp | grep 3389

      - name: RDP Access Info
        run: |
          echo "=============================="
          echo "RDP Address : $TAILSCALE_IP"
          echo "Username    : $RDP_USER"
          echo "Password    : $RDP_PASS"
          echo "Desktop     : Ubuntu GNOME"
          echo "=============================="

      - name: Keep Runner Alive
        run: |
          while true; do
            echo "[`date`] RDP ACTIVE"
            sleep 300
          done
